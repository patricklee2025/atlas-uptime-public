name: Test monitor safety
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt
          env -u GITHUB_STEP_SUMMARY .venv/bin/python -m unittest discover -s tests -v
